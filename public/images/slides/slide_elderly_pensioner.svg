<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="elderlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09241a" />
      <stop offset="50%" stop-color="#143c2c" />
      <stop offset="100%" stop-color="#141916" />
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#elderlyBg)" />

  <g transform="translate(1080, 240)">
    <!-- Peaceful clock / timeout comparison ring -->
    <g transform="translate(260, 160)">
      <!-- Relaxed 40s arc (green/gold) -->
      <circle cx="120" cy="120" r="110" fill="none" stroke="#253a2f" stroke-width="14" />
      <circle cx="120" cy="120" r="110" fill="none" stroke="#D4AF37" stroke-width="14" stroke-dasharray="520" stroke-dashoffset="130" stroke-linecap="round" />
      <text x="120" y="110" fill="#D4AF37" font-size="36" font-family="monospace" font-weight="bold" text-anchor="middle">40s</text>
      <text x="120" y="145" fill="#a7f3d0" font-size="14" font-family="system-ui" text-anchor="middle">Safe Entry Window</text>
    </g>

    <!-- Keypad 9: "Repeat" Button highlight -->
    <g transform="translate(160, 440)">
      <rect x="0" y="0" width="440" height="120" rx="20" fill="#14241b" stroke="#D4AF37" stroke-width="2.5" />
      <rect x="25" y="25" width="70" height="70" rx="16" fill="#D4AF37" />
      <text x="60" y="70" fill="#0F382A" font-size="32" font-family="system-ui" font-weight="bold" text-anchor="middle">9</text>
      <text x="115" y="55" fill="#FFFFFF" font-size="18" font-family="system-ui" font-weight="bold">Press 9 Anytime to Repeat Audio</text>
      <text x="115" y="85" fill="#cbd5e1" font-size="14" font-family="system-ui">Never lose your place or panic about missing details</text>
    </g>
  </g>

  <rect x="0" y="1064" width="1920" height="16" fill="url(#goldGrad4)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a261c" />
      <stop offset="40%" stop-color="#0F382A" />
      <stop offset="100%" stop-color="#141916" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <pattern id="kentePattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 L30 0 L60 30 L30 60 Z" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.08" />
      <circle cx="30" cy="30" r="4" fill="#D4AF37" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#kentePattern)" />

  <!-- Ambient Golden Glow -->
  <circle cx="1350" cy="500" r="450" fill="#D4AF37" opacity="0.07" filter="blur(60px)" />

  <!-- Scene Composition: Market Setting & Modern Voice Waves -->
  <g transform="translate(1000, 240)">
    <!-- Market stall fabric silhouette canopy -->
    <path d="M 50 150 Q 250 80 450 140 Q 650 90 850 160 L 800 680 L 100 680 Z" fill="#0b2018" opacity="0.6" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Phone with Voice Radiating waves -->
    <rect x="350" y="240" width="220" height="420" rx="36" fill="#18231E" stroke="#D4AF37" stroke-width="3" />
    <rect x="375" y="290" width="170" height="240" rx="16" fill="#0d1411" stroke="#25352c" stroke-width="2" />
    
    <!-- Incoming Call Simulation on screen -->
    <circle cx="460" cy="360" r="32" fill="#D4AF37" opacity="0.2" />
    <text x="460" y="367" fill="#D4AF37" font-size="22" font-family="system-ui" text-anchor="middle" font-weight="bold">📞</text>
    <text x="460" y="420" fill="#FFFFFF" font-size="14" font-family="system-ui" text-anchor="middle" font-weight="bold">Ɔkwankyerɛfo Pa</text>
    <text x="460" y="445" fill="#D4AF37" font-size="12" font-family="system-ui" text-anchor="middle">+233 30 804 8098</text>
    <text x="460" y="480" fill="#4ade80" font-size="11" font-family="system-ui" text-anchor="middle">● Call in Progress</text>

    <!-- Physical Button Pad -->
    <circle cx="410" cy="560" r="14" fill="#25352c" />
    <circle cx="460" cy="560" r="14" fill="#25352c" />
    <circle cx="510" cy="560" r="14" fill="#25352c" />
    <circle cx="410" cy="600" r="14" fill="#25352c" />
    <circle cx="460" cy="600" r="14" fill="#25352c" />
    <circle cx="510" cy="600" r="14" fill="#25352c" />

    <!-- Spoken Voice Soundwaves expanding out -->
    <path d="M 600 370 A 90 90 0 0 1 600 530" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M 630 340 A 130 130 0 0 1 630 560" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <path d="M 660 310 A 170 170 0 0 1 660 590" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.35" />

    <!-- Dialogue Bubble: Akan Twi Voice Command -->
    <g transform="translate(180, 160)">
      <rect x="0" y="0" width="360" height="90" rx="18" fill="#141E19" stroke="#D4AF37" stroke-width="2" />
      <text x="24" y="36" fill="#F3E5AB" font-size="15" font-family="system-ui" font-weight="bold">🗣️ "Woremane sika cedi 500..."</text>
      <text x="24" y="65" fill="#cbd5e1" font-size="13" font-family="system-ui">Sending GH₵ 500 to Kwame Nyamebere</text>
      <circle cx="330" cy="45" r="12" fill="#22c55e" opacity="0.3" />
      <circle cx="330" cy="45" r="6" fill="#22c55e" />
    </g>
  </g>

  <!-- Ghanaian Culture Accent Bar -->
  <rect x="0" y="1064" width="1920" height="16" fill="url(#goldGrad)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071712" />
      <stop offset="50%" stop-color="#0e2a1e" />
      <stop offset="100%" stop-color="#141916" />
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#secBg)" />

  <!-- Zero-PIN Security Architecture Visual -->
  <g transform="translate(1080, 200)">
    <!-- Security Shield in background -->
    <path d="M 280 80 L 480 150 L 480 340 C 480 480 280 580 280 580 C 280 580 80 480 80 340 L 80 150 Z" fill="#0d2419" stroke="#D4AF37" stroke-width="2" opacity="0.4" />
    
    <!-- Phone Screen showing Private RequestToPay Screen Prompt -->
    <g transform="translate(160, 100)">
      <rect x="0" y="0" width="300" height="500" rx="36" fill="#18231d" stroke="#D4AF37" stroke-width="3" />
      <!-- Top speaker notch -->
      <rect x="110" y="16" width="80" height="6" rx="3" fill="#364b3f" />

      <!-- USSD Dialog Box on phone screen -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="260" height="280" rx="16" fill="#0a120e" stroke="#22c55e" stroke-width="2" />
        <text x="130" y="35" fill="#4ade80" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">TELCO AUTHORIZATION PUSH</text>
        <line x1="20" y1="50" x2="240" y2="50" stroke="#1d3827" stroke-width="1" />
        
        <text x="20" y="80" fill="#FFFFFF" font-size="13" font-family="system-ui" font-weight="bold">Approve GHS 500.00</text>
        <text x="20" y="105" fill="#cbd5e1" font-size="12" font-family="system-ui">to Kwame Nyamebere</text>
        <text x="20" y="130" fill="#94a3b8" font-size="11" font-family="system-ui">Fee: GHS 3.75 • Ref: OKP-847291</text>
        
        <text x="20" y="170" fill="#D4AF37" font-size="12" font-family="system-ui" font-weight="bold">Enter 4-digit secret MoMo PIN:</text>
        <!-- PIN bullets -->
        <g transform="translate(60, 190)">
          <circle cx="15" cy="15" r="8" fill="#D4AF37" />
          <circle cx="50" cy="15" r="8" fill="#D4AF37" />
          <circle cx="85" cy="15" r="8" fill="#D4AF37" />
          <circle cx="120" cy="15" r="8" fill="#D4AF37" />
        </g>
        
        <!-- Screen action buttons -->
        <rect x="20" y="235" width="100" height="32" rx="6" fill="#15803d" />
        <text x="70" y="255" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">1: Confirm</text>
        <rect x="140" y="235" width="100" height="32" rx="6" fill="#334155" />
        <text x="190" y="255" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">2: Cancel</text>
      </g>

      <!-- Mic Muted Status Bar -->
      <g transform="translate(20, 370)">
        <rect x="0" y="0" width="260" height="85" rx="14" fill="#2d1515" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="35" cy="42" r="18" fill="#ef4444" opacity="0.2" />
        <text x="35" y="48" fill="#ef4444" font-size="16" text-anchor="middle">🔇</text>
        <text x="65" y="36" fill="#fca5a5" font-size="12" font-weight="bold">VOICE MIC MUTED</text>
        <text x="65" y="56" fill="#f87171" font-size="11">Zero PIN Eavesdropping</text>
        <text x="65" y="72" fill="#cbd5e1" font-size="10">Audio disconnected during PIN</text>
      </g>
    </g>
  </g>

  <rect x="0" y="1064" width="1920" height="16" fill="url(#goldGrad5)" />
</svg>

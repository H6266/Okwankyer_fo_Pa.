<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="ruralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092017" />
      <stop offset="50%" stop-color="#113524" />
      <stop offset="100%" stop-color="#141916" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#ruralBg)" />

  <!-- Natural landscape contours in background -->
  <path d="M 0 750 Q 480 620 960 700 Q 1440 780 1920 660 L 1920 1080 L 0 1080 Z" fill="#0b2419" opacity="0.7" />
  <path d="M 0 830 Q 560 720 1120 810 Q 1600 750 1920 820 L 1920 1080 L 0 1080 Z" fill="#071911" />

  <!-- Feature Phone Graphic -->
  <g transform="translate(1080, 220)">
    <!-- Cellular Tower with 2G Voice Waves -->
    <path d="M 120 540 L 170 120 L 220 540 Z" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.35" />
    <line x1="140" y1="280" x2="200" y2="280" stroke="#D4AF37" stroke-width="2" opacity="0.5" />
    <line x1="130" y1="380" x2="210" y2="380" stroke="#D4AF37" stroke-width="2" opacity="0.5" />
    <circle cx="170" cy="115" r="8" fill="#D4AF37" />
    <!-- Signal arcs -->
    <path d="M 170 70 A 50 50 0 0 1 210 110" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8" />
    <path d="M 170 40 A 80 80 0 0 1 240 110" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.5" />

    <!-- Feature Phone (Itel / Nokia Style) -->
    <g transform="translate(320, 140)">
      <rect x="0" y="0" width="240" height="460" rx="32" fill="#1b2820" stroke="#D4AF37" stroke-width="3" />
      <!-- Screen -->
      <rect x="25" y="40" width="190" height="170" rx="12" fill="#203328" stroke="#375543" stroke-width="2" />
      <text x="120" y="80" fill="#a7f3d0" font-size="13" font-family="monospace" text-anchor="middle">VOICE CALL ACTIVE</text>
      <text x="120" y="115" fill="#FFFFFF" font-size="16" font-family="system-ui" font-weight="bold" text-anchor="middle">+233 30 804 8098</text>
      <text x="120" y="145" fill="#D4AF37" font-size="14" font-family="system-ui" text-anchor="middle">02:45 • No Data Used</text>
      <text x="120" y="180" fill="#cbd5e1" font-size="12" font-family="monospace" text-anchor="middle">GSM 2G Channel</text>

      <!-- Directional D-pad & Buttons -->
      <circle cx="120" cy="255" r="26" fill="#132018" stroke="#D4AF37" stroke-width="1.5" />
      <rect x="35" y="240" width="45" height="28" rx="8" fill="#15803d" /> <!-- Call button -->
      <rect x="160" y="240" width="45" height="28" rx="8" fill="#991b1b" /> <!-- End button -->

      <!-- 12-key physical grid -->
      <g fill="#273a2f" stroke="#132018" stroke-width="2" rx="6">
        <!-- Row 1 -->
        <rect x="35" y="300" width="50" height="30" rx="6" />
        <rect x="95" y="300" width="50" height="30" rx="6" />
        <rect x="155" y="300" width="50" height="30" rx="6" />
        <!-- Row 2 -->
        <rect x="35" y="338" width="50" height="30" rx="6" />
        <rect x="95" y="338" width="50" height="30" rx="6" />
        <rect x="155" y="338" width="50" height="30" rx="6" />
        <!-- Row 3 -->
        <rect x="35" y="376" width="50" height="30" rx="6" />
        <rect x="95" y="376" width="50" height="30" rx="6" />
        <rect x="155" y="376" width="50" height="30" rx="6" />
        <!-- Row 4 -->
        <rect x="35" y="414" width="50" height="30" rx="6" />
        <rect x="95" y="414" width="50" height="30" rx="6" />
        <rect x="155" y="414" width="50" height="30" rx="6" />
      </g>
    </g>

    <!-- Info Pill -->
    <g transform="translate(180, 480)">
      <rect x="0" y="0" width="380" height="70" rx="14" fill="#111f17" stroke="#D4AF37" stroke-width="1.5" />
      <text x="24" y="30" fill="#4ade80" font-size="14" font-family="system-ui" font-weight="bold">✓ 100% Offline from Internet</text>
      <text x="24" y="52" fill="#cbd5e1" font-size="12" font-family="system-ui">Reaches every village and cocoa farm in Ghana</text>
    </g>
  </g>

  <rect x="0" y="1064" width="1920" height="16" fill="url(#goldGrad2)" />
</svg>

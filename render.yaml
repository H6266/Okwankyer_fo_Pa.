services:
  - type: web
    name: okwankyer-fo-pa
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_VOICE_NUMBER
        value: "+233308048098"
      - key: PORT
        value: "3000"
      - key: BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

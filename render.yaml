services:
  - type: web
    name: okwankyer-fo-pa
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_VOICE_NUMBER
        value: "+233308048098"
      - key: BASE_URL
        sync: false

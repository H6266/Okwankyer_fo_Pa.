name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, Data & Security Audit, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Copy Audit
        run: npm run check:copy

      - name: Lint AI and Dataset Governance
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Validate Dataset Licensing
        run: npm run ai:data:validate

      - name: Compile Python AI and data tooling
        run: python -m compileall -q ml training scripts

      - name: Test speaker-disjoint data splitting
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run Security Audit
        run: npm run security:audit

      - name: Run AI Evaluation Harness
        run: npm run ai:eval

      - name: Run Tests
        run: npm test

      - name: Production Build
        run: npm run build

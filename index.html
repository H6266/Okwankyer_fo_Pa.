    <!-- Guard against unhandled third-party browser extension errors (e.g. MetaMask / Web3 injected scripts in iframe) -->
    <script>
      (function() {
        function isExtensionError(err) {
          var str = String(err && (err.message || err.reason || err) || "").toLowerCase();
          return str.includes("metamask") || str.includes("ethereum") || str.includes("web3") || str.includes("chrome-extension");
        }
        window.addEventListener("error", function(e) {
          if (isExtensionError(e.error || e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener("unhandledrejection", function(e) {
          if (isExtensionError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
